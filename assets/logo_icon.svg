<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#7F00FF" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="128" fill="#0B0F19"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="url(#cyberGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Logo Mark Center -->
  <g transform="translate(106, 96)">
    <!-- Outer Shield Border with Glow -->
    <path d="M 150 20 
             L 260 60 
             L 260 180 
             C 260 260, 150 300, 150 300 
             C 150 300, 40 260, 40 180 
             L 40 60 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#cyberGrad)" 
          stroke-width="8" 
          filter="url(#glow)"/>

    <!-- Neural Inner Hexagon / AI Core -->
    <polygon points="150,85 200,115 200,175 150,205 100,175 100,115" 
             fill="none" 
             stroke="#00F2FE" 
             stroke-width="6" />

    <!-- Center Quantum Core Point -->
    <circle cx="150" cy="145" r="14" fill="#00F2FE" filter="url(#glow)"/>

    <!-- Dynamic Upward Sovereign Rays -->
    <line x1="150" y1="85" x2="150" y2="40" stroke="#00F2FE" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="115" x2="65" y2="90" stroke="#4FACFE" stroke-width="5" stroke-linecap="round"/>
    <line x1="200" y1="115" x2="235" y2="90" stroke="#4FACFE" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="175" x2="70" y2="200" stroke="#7F00FF" stroke-width="5" stroke-linecap="round"/>
    <line x1="200" y1="175" x2="230" y2="200" stroke="#7F00FF" stroke-width="5" stroke-linecap="round"/>
    <line x1="150" y1="205" x2="150" y2="260" stroke="#7F00FF" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
